  no-permission: "<red>You don't have permission to use this kit."
  no-kits-available: "<red>You don't have permission to use any kit."
  editor-usage: "<gray>Usage: <white>/duel kiteditor <kit></white>"
  editor-saved: "<green>Your <white><kit></white> layout has been saved."
  editor-reset-usage: "<gray>Usage: <white>/duel kitreset <kit></white>"
