prefix: "<gray>[<gold>Duels<gray>] </gray>"

general:
  no-permission: "<red>You don't have permission to do that."
  player-only: "<red>Only players can run this command."
  unknown-command: "<red>Unknown command. Try <white>/duel help</white>."
  reload-success: "<green>Configuration reloaded successfully."
  reload-failed: "<red>Reload failed. Check the console for details."
  help:
    - "<gold><bold>AngryDuels</bold></gold>"
    - "<gray>/duel <player> [kit] <dark_gray>- <white>send a duel request, optionally with a kit"
    - "<gray>/duel accept <dark_gray>- <white>accept the pending request"
    - "<gray>/duel deny <dark_gray>- <white>deny the pending request"
    - "<gray>/duel forfeit <dark_gray>- <white>forfeit your active duel"

duel:
  self: "<red>You can't duel yourself."
  target-offline: "<red>That player is not online."
  sender-busy: "<red>You already have a pending request or an active duel."
  target-busy: "<red>That player is already busy with another duel or request."
  cooldown: "<red>Wait <white><seconds>s</white> before sending another request."
  request-sent: "<green>Duel request sent to <white><target></white> <gray>with kit <white><kit></white></gray>."
  request-sent-no-kit: "<green>Duel request sent to <white><target></white>."
  request-received: "<yellow><sender></yellow> <gray>wants to duel you with kit <white><kit></white>! <green><click:run_command:'/duel accept'>[ACCEPT]</click></green> <red><click:run_command:'/duel deny'>[DENY]</click></red>"
  request-received-no-kit: "<yellow><sender></yellow> <gray>wants to duel you! <green><click:run_command:'/duel accept'>[ACCEPT]</click></green> <red><click:run_command:'/duel deny'>[DENY]</click></red>"
  request-expired-sender: "<red>Your duel request to <white><target></white> expired."
  request-expired-target: "<gray>The duel request from <white><sender></white> expired."
  request-cancelled: "<yellow>The duel request was cancelled."
  no-incoming: "<red>You have no incoming duel request."
  accepted-sender: "<green><white><target></white> accepted your duel request!"
  accepted-target: "<green>You accepted the duel request."
  denied-sender: "<red><white><target></white> denied your duel request."
  denied-target: "<yellow>You denied the duel request."
  started: "<gold>The duel has started! Good luck."
  ended-win: "<green>You won the duel!"
  ended-loss: "<red>You lost the duel."
  ended-cancelled: "<yellow>The duel has been cancelled."
  not-in-duel: "<red>You're not in an active duel."

arena:
  usage: "<gray>Usage: <white>/duel arena <list|create|setspawn|delete|reload>"
  no-world: "<red>Duel world is not available. Check the console."
  already-exists: "<red>Arena <white><id></white> already exists."
  not-found: "<red>Arena <white><id></white> not found."
  created: "<green>Arena <white><id></white> created. Use <white>/duel arena setspawn <id> 1|2</white> to refine spawns."
  deleted: "<yellow>Arena <white><id></white> deleted."
  spawn-set: "<green>Spawn <white><which></white> for arena <white><id></white> updated."
  reloaded: "<green>Arenas reloaded from config."
  list-empty: "<yellow>No arenas configured."
  list-header: "<gold>Arenas <gray>(<white><count></white>)"
  list-entry: "<gray>- <white><id></white> <dark_gray>|</dark_gray> <gray>world: <white><world></white> <dark_gray>|</dark_gray> <gray>state: <white><state></white>"
  no-arena-available: "<red>No free arena available. Try again later."

kit:
  not-found: "<red>Kit <white><kit></white> not found."
  no-permission: "<red>You don't have permission to use this kit."

stats:
  not-found: "<red>No stats found for <white><player></white>."
  header:
    - "<gold><bold>Stats of <white><player></white></bold></gold>"
  body:
    - "<gray>Wins: <green><wins></green> <dark_gray>|</dark_gray> Losses: <red><losses></red> <dark_gray>|</dark_gray> Played: <white><played></white>"
    - "<gray>Kills: <green><kills></green> <dark_gray>|</dark_gray> Deaths: <red><deaths></red> <dark_gray>|</dark_gray> K/D: <white><kdr></white>"
    - "<gray>Forfeits: <white><forfeits></white> <dark_gray>|</dark_gray> Quits: <white><quits></white>"
    - "<gray>Streak: <yellow><streak></yellow> <dark_gray>|</dark_gray> Best: <gold><best_streak></gold>"
    - "<gray>Win rate: <white><winrate>%</white>"
  top-usage: "<gray>Usage: <white>/duel top <wins|losses|played|streak|beststreak|kdr> [page|gui]"
  top-unknown-category: "<red>Unknown category <white><category></white>."
  top-empty: "<yellow>No entries to display."
  top-header: "<gold><bold><category></bold></gold> <gray>· page <white><page></white>/<white><pages></white>"
  top-entry: "<gray>#<white><rank></white> <dark_gray>|</dark_gray> <yellow><player></yellow> <dark_gray>-</dark_gray> <white><value></white>"
  reset-all: "<green>All stats have been reset."
  reset-one: "<green>Stats of <white><player></white> have been reset."
  reset-usage: "<gray>Usage: <white>/duel stats reset <player></white>"