# ================================================================
#  AngryDuels - configuration
#  Reload in-game with /duels reload
# ================================================================

settings:
  debug: false

duel:
  request-timeout-seconds: 30
  countdown-seconds: 5
  cooldown-seconds: 10
  prevent-same-ip: false

world:
  name: duels_world
  auto-create: true

storage:
  type: mysql
  mysql:
    host: localhost
    port: 3306
    database: duels
    username: root
    password: ''
    pool-size: 10
    use-ssl: false

# ================================================================
#  Arenas
#  Managed in-game with /duel arena <list|create|setspawn|delete|reload>
#  Structure is filled automatically by the plugin.
# ================================================================
arenas: {}

# ================================================================
#  Rewards
#
#  Types:
#    console   - dispatches a command as the console sender
#                keys: command
#    item      - gives an item; uses the same format as kits.yml
#                keys: material, amount, enchants, name, unbreakable
#    money     - deposits through Vault (requires Vault + economy)
#                keys: amount
#    xp        - gives experience points and/or levels
#                keys: points, levels
#    broadcast - sends a MiniMessage line to everyone
#                keys: message
#
#  Placeholders:
#    %winner%   %loser%   %arena%   %kit%   %reason%   %duration%
#
#  A kit-specific list under rewards.kits fully replaces the default
#  list when a duel uses that kit.
# ================================================================
rewards:
  enabled: true
  grant-delay-ticks: 20
  cooldown-seconds: 0

  default:
    - type: broadcast
      message: "<gray>[<gold>Duels<gray>] <white>%winner%</white> defeated <white>%loser%</white> in <white>%arena%</white>!"
    - type: xp
      points: 30

  kits:
    sword:
      - type: broadcast
        message: "<gray>[<gold>Duels<gray>] <white>%winner%</white> won a <gold>Sword</gold> duel against <white>%loser%</white>!"
      - type: xp
        points: 50
    netheritepot:
      - type: broadcast
        message: "<gray>[<gold>Duels<gray>] <white>%winner%</white> won a <gold>Netherite Pot</gold> duel against <white>%loser%</white>!"
      - type: xp
        points: 200
      - type: item
        material: DIAMOND
        amount: 3

# ================================================================
#  Stats
#
#  enabled           - master switch for MySQL statistics
#  entries-per-page  - entries shown per leaderboard page
#  refresh-minutes   - how often the leaderboard cache is refreshed
#
#  Requires the storage.mysql block above to be configured.
# ================================================================
stats:
  enabled: true
  leaderboard:
    entries-per-page: 10
    refresh-minutes: 2