# ================================================================
#  AngryDuels - configuration
#  Reload in-game with /duels reload
# ================================================================

settings:
  debug: false
  language: en

duel:
  request-timeout-seconds: 30
  countdown-seconds: 5
  cooldown-seconds: 10
  prevent-same-ip: false

world:
  name: duels_world
  auto-create: true
  generator: void

storage:
  type: mysql
  mysql:
    host: localhost
    port: 3306
    database: duels
    username: root
    password: ''
    pool-size: 10
    use-ssl: false

# ================================================================
#  Arenas
#  Managed in-game with /duel arena <list|create|setspawn|delete|reload>
#  Structure is filled automatically by the plugin.
# ================================================================
arenas: {}