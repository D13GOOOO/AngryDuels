# ================================================================
#  AngryDuels - kits
#
#  Slot layout (native Bukkit slots):
#    0-8    hotbar
#    9-35   main inventory (27 slots)
#    36     boots
#    37     leggings
#    38     chestplate
#    39     helmet
#    40     offhand
#
#  Item format:
#    type:          Material name (required)
#    amount:        stack size (default 1)
#    enchants:      map of enchantment key -> level
#    potion-type:   PotionType key, only for potion-like materials
#    name:          MiniMessage display name
#    unbreakable:   boolean
#
#  The optional `icon` block, parsed with the same format as regular
#  items, defines what the kit selector GUI shows. If missing, the item
#  in slot 0 is used as a fallback.
# ================================================================

kits:

  sword:
    display-name: "Sword"
    permission: duels.kit.sword
    aliases: []
    icon:
      type: DIAMOND_SWORD
    slots:
      0:
        type: DIAMOND_SWORD
        enchants:
          unbreaking: 3
      36:
        type: DIAMOND_BOOTS
        enchants:
          protection: 3
          unbreaking: 3
      37:
        type: DIAMOND_LEGGINGS
        enchants:
          protection: 3
          unbreaking: 3
      38:
        type: DIAMOND_CHESTPLATE
        enchants:
          protection: 3
          unbreaking: 3
      39:
